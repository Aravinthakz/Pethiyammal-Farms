server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 24MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/rmsvg;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2

app:
  jwt-secret: ${JWT_SECRET:rmsvg-livestock-dev-secret-change-this-key-32b}
  jwt-expiration-ms: 86400000
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rmsvg_livestock?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
